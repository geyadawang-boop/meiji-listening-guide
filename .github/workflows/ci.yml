name: CI

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      linux_visual_runtime:
        description: Verify actual Linux Electron visual capture using the fixed source candidate
        required: false
        type: boolean
        default: false
      linux_source_build:
        description: Build isolated Ubuntu 24.04 x64 source candidate (not a release)
        required: false
        type: boolean
        default: false
      linux_pixel_diagnostics:
        description: Diagnose pixels from the fixed Linux candidate without recompilation
        required: false
        type: boolean
        default: false
      pixel_candidate_run:
        description: Fixed candidate run for Linux pixel diagnostics (old baseline remains the default)
        required: false
        type: choice
        default: '39107720545'
        options:
          - '39107720545'
          - '39109258520'
      asr_runtime:
        description: Verify actual local Chinese ASR using fixed public models and installed Mandarin voice
        required: false
        type: boolean
        default: false
      visual_runtime:
        description: Verify real Electron visual capture with the fixed reviewed Mac candidate
        required: false
        type: boolean
        default: false
      v2_status:
        description: Verify production read-only v2 component status on macOS arm64
        required: false
        type: boolean
        default: false
      v2_fixture:
        description: Verify fixture-only v2 publishing and POSIX permissions on macOS arm64
        required: false
        type: boolean
        default: false
      source_build:
        description: Build and verify isolated macOS arm64 source candidates (not a release)
        required: false
        type: boolean
        default: false
      source_prepare:
        description: Verify and extract fixed source archives on macOS without building
        required: false
        type: boolean
        default: false
      media_candidate:
        description: Run locked third-party FFmpeg candidates in isolated target runners
        required: false
        type: boolean
        default: false

jobs:
  linux-visual-runtime:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_visual_runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools xvfb
      - run: pnpm install --frozen-lockfile
      - name: Configure owned Electron sandbox helper
        shell: bash
        run: |
          set -euo pipefail
          helper=$(node -e "const fs=require('node:fs'),p=require('node:path');const e=fs.realpathSync(require('electron'));const h=p.join(p.dirname(e),'chrome-sandbox');const root=fs.realpathSync('node_modules');if(!h.startsWith(root+p.sep)||fs.lstatSync(h).isSymbolicLink()||!fs.statSync(h).isFile())throw Error('Unexpected sandbox helper');console.log(h)")
          sudo chown root:root "$helper"
          sudo chmod 4755 "$helper"
          test "$(stat -c '%u:%g:%a' "$helper")" = "0:0:4755"
      - name: Obtain fixed Linux visual candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          metadata=$(gh api repos/geyadawang-boop/meiji-listening-guide/actions/artifacts/12129619803)
          test "$(printf '%s' "$metadata" | jq -r '.workflow_run.id')" = "39109258520"
          test "$(printf '%s' "$metadata" | jq -r '.expired')" = "false"
          mkdir "$RUNNER_TEMP/linux-visual-input"
          gh api repos/geyadawang-boop/meiji-listening-guide/actions/artifacts/12129619803/zip > "$RUNNER_TEMP/linux-visual-input.zip"
          unzip -j "$RUNNER_TEMP/linux-visual-input.zip" source-build-candidate.tar.gz build-result.json -d "$RUNNER_TEMP/linux-visual-input"
      - run: xvfb-run --auto-servernum node scripts/visual-runtime-smoke.mts "${{ runner.temp }}/linux-visual-input" "${{ runner.temp }}/linux-visual-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-visual-runtime-results
          path: ${{ runner.temp }}/linux-visual-results
          if-no-files-found: warn

  linux-pixel-diagnostics:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && inputs.linux_pixel_diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: pnpm install --frozen-lockfile
      - name: Obtain exact Linux source candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PIXEL_CANDIDATE_RUN: ${{ inputs.pixel_candidate_run }}
        run: |
          set -euo pipefail
          case "$PIXEL_CANDIDATE_RUN" in
            39107720545) artifact_id=12128894879 ;;
            39109258520) artifact_id=12129619803 ;;
            *) echo "Unknown fixed candidate run ID" >&2; exit 1 ;;
          esac
          metadata=$(gh api "repos/geyadawang-boop/meiji-listening-guide/actions/artifacts/$artifact_id")
          test "$(printf '%s' "$metadata" | jq -r '.workflow_run.id')" = "$PIXEL_CANDIDATE_RUN"
          test "$(printf '%s' "$metadata" | jq -r '.expired')" = "false"
          mkdir "$RUNNER_TEMP/pixel-input"
          gh api "repos/geyadawang-boop/meiji-listening-guide/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/pixel-input.zip"
          unzip -j "$RUNNER_TEMP/pixel-input.zip" source-build-candidate.tar.gz build-result.json -d "$RUNNER_TEMP/pixel-input"
      - name: Compare actual candidate pixel paths
        env:
          PIXEL_CANDIDATE_RUN: ${{ inputs.pixel_candidate_run }}
        run: node scripts/media-pixel-diagnostics.mts "${{ runner.temp }}/pixel-input" "${{ runner.temp }}/pixel-results" "$PIXEL_CANDIDATE_RUN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-pixel-diagnostics
          path: ${{ runner.temp }}/pixel-results
          if-no-files-found: warn

  linux-source-build:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && inputs.linux_source_build && !inputs.linux_pixel_diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install isolated runner build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libarchive-tools zlib1g-dev nasm
      - run: pnpm install --frozen-lockfile
      - name: Build and verify Linux source candidate only
        run: node scripts/media-source-build.mts --output "${{ runner.temp }}/linux-source-build-artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-source-build-candidate-not-release
          path: ${{ runner.temp }}/linux-source-build-artifacts
          retention-days: 7
          if-no-files-found: warn

  asr-runtime:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && !inputs.linux_pixel_diagnostics && !inputs.linux_source_build && inputs.asr_runtime
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Obtain the fixed reviewed media candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(gh api repos/geyadawang-boop/meiji-listening-guide/actions/artifacts/12108250900)
          test "$(printf '%s' "$metadata" | jq -r '.workflow_run.id')" = "39051917827"
          test "$(printf '%s' "$metadata" | jq -r '.expired')" = "false"
          mkdir "$RUNNER_TEMP/asr-input"
          gh api repos/geyadawang-boop/meiji-listening-guide/actions/artifacts/12108250900/zip > "$RUNNER_TEMP/asr-input.zip"
          unzip -j "$RUNNER_TEMP/asr-input.zip" source-build-candidate.tar.gz build-result.json -d "$RUNNER_TEMP/asr-input"
      - name: Verify local inference without user audio
        run: node scripts/asr-runtime-smoke.mts "${{ runner.temp }}/asr-input" "${{ runner.temp }}/asr-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-runtime-results
          path: ${{ runner.temp }}/asr-results
          if-no-files-found: warn

  visual-runtime:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && !inputs.linux_pixel_diagnostics && !inputs.linux_source_build && inputs.visual_runtime && !inputs.asr_runtime
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Obtain the fixed reviewed source-build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          metadata=$(gh api repos/geyadawang-boop/meiji-listening-guide/actions/artifacts/12108250900)
          test "$(printf '%s' "$metadata" | jq -r '.workflow_run.id')" = "39051917827"
          test "$(printf '%s' "$metadata" | jq -r '.expired')" = "false"
          mkdir "$RUNNER_TEMP/visual-input"
          gh api repos/geyadawang-boop/meiji-listening-guide/actions/artifacts/12108250900/zip > "$RUNNER_TEMP/visual-input.zip"
          unzip -j "$RUNNER_TEMP/visual-input.zip" source-build-candidate.tar.gz build-result.json -d "$RUNNER_TEMP/visual-input"
      - name: Exercise production visual capture in real Electron
        run: node scripts/visual-runtime-smoke.mts "${{ runner.temp }}/visual-input" "${{ runner.temp }}/visual-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-runtime-results
          path: ${{ runner.temp }}/visual-results
          if-no-files-found: warn

  v2-status:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && !inputs.linux_pixel_diagnostics && !inputs.linux_source_build && inputs.v2_status && !inputs.visual_runtime && !inputs.asr_runtime
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/runtime-v2-status-smoke.mts "${{ runner.temp }}/v2-status-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-status-result
          path: ${{ runner.temp }}/v2-status-result.json
          if-no-files-found: warn

  v2-fixture:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && !inputs.linux_pixel_diagnostics && !inputs.linux_source_build && inputs.v2_fixture && !inputs.v2_status && !inputs.visual_runtime && !inputs.asr_runtime
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify synthetic fixture only
        run: node scripts/runtime-v2-fixture-smoke.mts "${{ runner.temp }}/v2-fixture-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-fixture-result
          path: ${{ runner.temp }}/v2-fixture-result.json
          if-no-files-found: warn

  source-build:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && !inputs.linux_pixel_diagnostics && !inputs.linux_source_build && inputs.source_build && !inputs.v2_fixture && !inputs.v2_status && !inputs.visual_runtime && !inputs.asr_runtime
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and verify source candidate only
        run: node scripts/media-source-build.mts --output "${{ runner.temp }}/media-source-build-artifacts"
      - name: Upload isolated candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-source-build-candidate-not-release
          path: ${{ runner.temp }}/media-source-build-artifacts
          retention-days: 7
          if-no-files-found: warn

  source-prepare:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && !inputs.linux_pixel_diagnostics && !inputs.linux_source_build && inputs.source_prepare && !inputs.source_build && !inputs.v2_fixture && !inputs.v2_status && !inputs.visual_runtime && !inputs.asr_runtime
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare source archives only
        run: node scripts/media-source-prepare.mts > "${{ runner.temp }}/source-prepare-result.json"
      - name: Upload preparation result only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-prepare-macos
          path: ${{ runner.temp }}/source-prepare-result.json
          if-no-files-found: warn

  media-candidate:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && !inputs.linux_pixel_diagnostics && !inputs.linux_source_build && inputs.media_candidate && !inputs.source_prepare && !inputs.source_build && !inputs.v2_fixture && !inputs.v2_status && !inputs.visual_runtime && !inputs.asr_runtime
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            source: eugeneware-b6.1.1-darwin-arm64
          - os: ubuntu-latest
            source: eugeneware-b6.1.1-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify isolated media candidates
        run: node scripts/media-candidate-smoke.mts --source "${{ matrix.source }}" --output "${{ runner.temp }}/meiji-media-results"
      - name: Upload results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media-candidate-${{ matrix.os }}
          path: ${{ runner.temp }}/meiji-media-results/*.json
          if-no-files-found: warn

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify (typecheck + format + lint)
        run: pnpm verify
      - name: Build
        run: pnpm build

  runtime-smoke:
    if: github.event_name == 'workflow_dispatch' && !inputs.linux_visual_runtime && !inputs.linux_pixel_diagnostics && !inputs.linux_source_build && !inputs.media_candidate && !inputs.source_prepare && !inputs.source_build && !inputs.v2_fixture && !inputs.v2_status && !inputs.visual_runtime && !inputs.asr_runtime
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Prepare Linux secure storage
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring libsecret-1-0 dbus-x11 xvfb fonts-noto-cjk
      - name: Verify Linux runtime with a real secret service
        if: runner.os == 'Linux'
        shell: bash
        run: |
          dbus-run-session -- bash -euo pipefail -c '
            smoke_keyring_password=$(openssl rand -hex 24)
            smoke_keyring_environment=$(printf "%s" "$smoke_keyring_password" | gnome-keyring-daemon --unlock --components=secrets)
            eval "$smoke_keyring_environment"
            xvfb-run --auto-servernum pnpm runtime:smoke --output "$RUNNER_TEMP/meiji-runtime-smoke"
          '
      - name: Verify Windows or macOS runtime
        if: runner.os != 'Linux'
        run: pnpm runtime:smoke --output "${{ runner.temp }}/meiji-runtime-smoke"
      - name: Upload only results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/meiji-runtime-smoke/results
          if-no-files-found: warn
